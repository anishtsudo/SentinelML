[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelml"
version = "0.1.0"
description = "High-performance network intrusion detection and benchmarking system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Lower bounds only. Exact versions are captured in requirements.lock.txt
# (generated by scripts/setup_env.sh) so benchmark runs are reproducible.
dependencies = [
    "numpy>=2.1",          # macOS arm64 wheels link Apple Accelerate for BLAS
    "pandas>=2.2",
    "pyarrow>=17",         # Parquet for the processed-data cache (much faster than CSV)
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    "psutil>=6.0",         # RSS / memory measurement in the benchmark harness
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
